[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "supportpilot"
version = "0.1.0"
description = "Evidence-based support investigation and human review"
requires-python = ">=3.12"
dependencies = [
  "fastapi", "pydantic-settings", "sqlalchemy", "psycopg[binary]",
  "pgvector", "httpx", "uvicorn", "openai", "anthropic", "cryptography",
]

[project.scripts]
supportpilot = "supportpilot.cli_bridge:main"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["backend/supportpilot"]

[tool.pytest.ini_options]
pythonpath = ["backend", "."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]
