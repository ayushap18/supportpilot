name: Deploy to Render
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: render-production
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check commit is still main
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          current="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [ "$current" = "$TESTED_COMMIT" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "A newer commit exists; skipping this older deployment."
          fi
      - name: Trigger tested commit
        if: steps.current.outputs.deploy == 'true'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          TESTED_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: python scripts/deploy_render.py
