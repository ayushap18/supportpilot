name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: supportpilot_test
          POSTGRES_USER: supportpilot
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supportpilot -d supportpilot_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SUPPORTPILOT_TEST_POSTGRES_URL: postgresql+psycopg://supportpilot:ci-only-password@localhost:5432/supportpilot_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: python -m evals.run --minimum-outcome-accuracy .95 --output evals/runs/ci
      - uses: actions/upload-artifact@v4
        with:
          name: fixture-evaluation-report
          path: evals/runs/ci
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements.lock
      - run: .venv/bin/python -m pip install --no-deps --no-build-isolation -e .
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:browser
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-traces
          path: frontend/test-results
  container:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: supportpilot:test
          build-args: BUILD_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test packaged application
        run: |
          docker run -d --name supportpilot-smoke -p 8000:8000 supportpilot:test
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://localhost:8000/health/ready > /dev/null; then
              break
            fi
            sleep 2
          done
          curl --silent --show-error --fail http://localhost:8000/health/ready
          curl --silent --show-error --fail http://localhost:8000/ | grep 'SupportPilot'
          if [ "$(curl --silent -o /dev/null -w '%{http_code}' http://localhost:8000/api/tickets)" != "401" ]; then
            exit 1
          fi
      - name: Container logs
        if: failure()
        run: docker logs supportpilot-smoke
