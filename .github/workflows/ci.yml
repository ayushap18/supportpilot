name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: supportpilot_test
          POSTGRES_USER: supportpilot
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supportpilot -d supportpilot_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SUPPORTPILOT_TEST_POSTGRES_URL: postgresql+psycopg://supportpilot:ci-only-password@localhost:5432/supportpilot_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
