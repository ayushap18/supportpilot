services:
  - type: web
    name: supportpilot
    runtime: docker
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: off
    healthCheckPath: /health/ready
    envVars:
      - key: SUPPORTPILOT_DATABASE_URL
        fromDatabase:
          name: supportpilot-db
          property: connectionString
      - key: SUPPORTPILOT_API_TOKENS_JSON
        sync: false
      - key: SUPPORTPILOT_MODE
        value: fixture
      - key: SUPPORTPILOT_MAX_INVESTIGATIONS_PER_HOUR
        value: '30'
databases:
  - name: supportpilot-db
    plan: free
    region: singapore
    databaseName: supportpilot
    user: supportpilot
    postgresMajorVersion: '16'
    ipAllowList: []
